<script src="news-data.js"></script>

<script>
  const newsList = document.getElementById("news-list");

  newsData.forEach(function(news) {

    const li = document.createElement("li");

    li.innerHTML = `
      <a href="${news.url}">
        <span class="news-mark">☆</span>
        ${news.title}
      </a>
    `;

    newsList.appendChild(li);

  });
</script>
